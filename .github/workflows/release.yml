# Release (feature 10): build and push the 4 images to GitHub Container Registry (free for public repos),
# tagged with the git sha. MANUAL ONLY until Naveed has said "haan" for the first push — then a
# `push: branches: [main]` trigger can be added in a reviewed PR.
name: release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type haan to push images to ghcr.io'
        required: true

permissions:
  contents: read
  packages: write   # push to ghcr.io/<owner>/...

jobs:
  push:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm == 'haan' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [wazuh-mcp, enrichment-mcp, agent-service, api-gateway]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          file: backend/services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ai-soc-${{ matrix.service }}:${{ github.sha }}
