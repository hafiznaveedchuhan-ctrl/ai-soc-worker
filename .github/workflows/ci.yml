# CI (feature 10). Runs on every PR and every push to feat/**. Every step is explained in backend/docs/LEARNING.md §13.
name: ci

on:
  pull_request:
  push:
    branches: ["feat/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes (path filters)
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # a change to the shared package / lockfile rebuilds every image
          filters: |
            wazuh-mcp: ['backend/services/wazuh-mcp/**', 'backend/packages/**', 'backend/uv.lock', 'backend/evals/data/alerts/**']
            enrichment-mcp: ['backend/services/enrichment-mcp/**', 'backend/packages/**', 'backend/uv.lock']
            agent-service: ['backend/services/agent-service/**', 'backend/packages/**', 'backend/uv.lock']
            api-gateway: ['backend/services/api-gateway/**', 'backend/packages/**', 'backend/uv.lock']

  python:
    name: python (lint · types · tests · demos · eval-dry)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: backend
          enable-cache: true
      - name: Install (exactly the locked versions)
        run: uv sync --all-packages --frozen
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Format check (ruff)
        run: uv run ruff format --check .
      - name: Types (mypy --strict)
        run: make typecheck
      - name: Tests + coverage (offline; no LLM, no network)
        run: uv run pytest --cov --cov-report=term --cov-fail-under=90
      - name: Masking demo (must print LEAK CHECK OK)
        run: uv run python scripts/demo_masking.py
      - name: MCP services demo (in memory, AbuseIPDB mocked)
        run: make demo-mcp
      - name: Agent demos (FAKE mode — scripted models, no API calls)
        run: |
          uv run python scripts/demo_agents.py ask
          uv run python scripts/demo_agents.py triage --approve
      - name: Eval dry run (gate — datasets + scorer must pass)
        run: make eval-dry

  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks v8.30.1
        run: |
          curl -sSfL -o gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan the whole git history
        run: ./gitleaks git --config .gitleaks.toml --redact --verbose .

  images:
    name: image ${{ matrix.service }} (build + Trivy)
    needs: [changes, python]
    if: ${{ needs.changes.outputs.services != '[]' && needs.changes.outputs.services != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build ai-soc/${{ matrix.service }}:${{ github.sha }} (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          file: backend/services/${{ matrix.service }}/Dockerfile
          tags: ai-soc/${{ matrix.service }}:${{ github.sha }}
          load: true
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Trivy scan (fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ai-soc/${{ matrix.service }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
