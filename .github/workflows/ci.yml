# CI skeleton (feature 01). Feature 10 adds path filters, eval-dry, docker build and Trivy.
# Every step is explained in backend/docs/LEARNING.md → "CI pipeline".
name: ci

on:
  pull_request:
  push:
    branches: ["feat/**"]

permissions:
  contents: read            # least privilege: CI only reads the repo

concurrency:                 # a new push cancels the older run of the same branch
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python (lint · types · tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: backend
          enable-cache: true
      - name: Install (exactly the locked versions)
        run: uv sync --all-packages --frozen
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Format check (ruff)
        run: uv run ruff format --check .
      - name: Types (mypy --strict)
        run: make typecheck   # same file list as on your laptop (Makefile SRC/TESTS)
      - name: Tests + coverage (offline)
        run: uv run pytest --cov --cov-report=term --cov-fail-under=90
      - name: Masking demo (must print LEAK CHECK OK)
        run: uv run python scripts/demo_masking.py
      - name: Eval dry run (free, offline — datasets + scorer must pass)
        run: make eval-dry

  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0     # full history: a secret in an old commit is still a leak
      - name: Install gitleaks v8.30.1 (free binary, no licence needed)
        run: |
          curl -sSfL -o gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan the whole git history
        run: ./gitleaks git --config .gitleaks.toml --redact --verbose .
