[project]
name = "enrichment-mcp"
version = "0.1.0"
description = "Threat-intel enrichment (MCP server): AbuseIPDB IP reputation with cache"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp==2.3.0",
    "soc-shared",
]

[tool.uv.sources]
soc-shared = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
