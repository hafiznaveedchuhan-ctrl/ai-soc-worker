[project]
name = "api-gateway"
version = "0.1.0"
description = "Public HTTP API: Auth0 JWT, roles, rate limit, CORS; the ONLY service with the database"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "cryptography>=50.0.2",
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.9",
    "pyjwt[crypto]>=2.15.1",
    "soc-shared",
    "sqlmodel>=0.0.49",
    "uvicorn>=0.54.0",
]

[tool.uv.sources]
soc-shared = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
