[project]
name = "agent-service"
version = "0.1.0"
description = "AI brain: OpenAI Agents SDK agents, guardrails, sessions, tracing (internal service)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "soc-shared",
    "ksor-client",
    "mcp==2.3.0",
    "openai-agents==0.24.0",
    "fastapi>=0.162.5",
    "uvicorn>=0.54.0",
    "httpx>=0.28.1",  # imported by deps.py (Tavily, MCP over HTTP); found by `make up`, 2026-11-18
]

[tool.uv.sources]
soc-shared = { workspace = true }
ksor-client = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
